[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easybackup"
version = "0.1.0"
description = "A maintainable local-first backup control center with incremental snapshots, S3-compatible storage, and SFTP."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "APScheduler>=3.10,<4",
    "alibabacloud-oss-v2>=1.3,<2",
    "boto3>=1.36,<2",
    "cryptography>=42",
    "fastapi>=0.115,<1",
    "filelock>=3.15,<4",
    "keyring>=25,<27",
    "paramiko>=4,<6",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
tray = [
    "Pillow>=10",
    "pystray>=0.19,<1",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
easybackup = "easybackup.cli:main"
easybackup-tray = "easybackup.tray:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easybackup = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
